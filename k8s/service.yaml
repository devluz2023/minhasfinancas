apiVersion: v1
kind: Service
metadata:
  name: langgraph-agent-service
spec:
  # LoadBalancer provisiona um IP público (na AWS cria um ELB/ALB)
  # Use ClusterIP se o agente for apenas para comunicação interna
  type: LoadBalancer 
  selector:
    app: langgraph-agent
  ports:
  - protocol: TCP
    port: 80 # Porta pública
    targetPort: 8000 # Porta que redireciona para o contêiner